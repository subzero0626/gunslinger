<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Gunslinger</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/ui/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/ui/favicon.png">
<link rel="apple-touch-icon" href="assets/ui/apple-touch-icon.png">
<meta name="theme-color" content="#1c1618">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<style>
  html, body {
    margin: 0; height: 100%; height: 100dvh; width: 100%;
    overflow: hidden; background: #1c1618;
    position: fixed; inset: 0;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  input, textarea {
    -webkit-user-select: text;
    user-select: text;
    touch-action: manipulation;
  }
  canvas {
    display: block; cursor: none; touch-action: none;
    position: fixed; left: 0; top: 0;
  }
  #wipeLayer {
    position: fixed;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    z-index: 20000;
    pointer-events: none;
  }
  #wipeLayer.is-on { pointer-events: auto; cursor: none; }

  .swal2-container { cursor: default; }
  .swal-wanted {
    background:
      radial-gradient(ellipse at 18% 12%, rgba(255,250,235,0.4), transparent 42%),
      linear-gradient(165deg, #ead6b4 0%, #dfc49a 48%, #d2b486 100%) !important;
    color: #3d2a1c !important;
    border: none !important;
    border-radius: 2px !important;
    font-family: "Palatino Linotype", "Book Antiqua", "Malgun Gothic", serif !important;
    box-shadow:
      3px 4px 0 rgba(20,10,6,0.35),
      inset 0 0 0 1px rgba(90,55,35,0.25) !important;
    clip-path: polygon(1% 0, 99% 1%, 100% 7%, 99% 94%, 97% 100%, 6% 99%, 0 93%, 1% 8%);
  }
  .swal-wanted .swal2-title {
    color: #6e281c !important;
    font-size: 22px !important;
    letter-spacing: 0.06em;
    font-weight: 700 !important;
  }
  .swal-wanted .swal2-html-container {
    color: rgba(61,42,28,0.8) !important;
    font-size: 13px !important;
  }
  .swal-wanted .swal2-input {
    background: rgba(255,248,230,0.55) !important;
    color: #3d2a1c !important;
    border: none !important;
    border-bottom: 2px dashed rgba(70,42,28,0.35) !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    letter-spacing: 0.35em;
    text-align: center;
    font-size: 22px !important;
    font-weight: 700;
  }
  .swal-wanted .swal2-input:focus {
    border-bottom-color: #6e281c !important;
    box-shadow: none !important;
  }
  .swal-wanted .swal2-validation-message {
    background: rgba(110,40,28,0.12) !important;
    color: #6e281c !important;
  }
  .swal-wanted .swal2-confirm {
    background: #8b2e1f !important;
    color: #f4e6d0 !important;
    border-radius: 2px !important;
    box-shadow: 2px 2px 0 rgba(40,18,10,0.25);
  }
  .swal-wanted .swal2-deny {
    background: rgba(255,248,230,0.35) !important;
    color: #3d2a1c !important;
    border: 1px solid rgba(90,55,35,0.35) !important;
    border-radius: 2px !important;
  }
  .swal-wanted .swal2-cancel {
    background: transparent !important;
    color: rgba(61,42,28,0.7) !important;
    border-radius: 2px !important;
  }
  .swal-wanted .swal2-timer-progress-bar {
    background: rgba(110,40,28,0.45) !important;
  }

  .law-pins {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    min-height: 46px;
  }
  .law-pins[data-side="guest"] { flex-direction: row-reverse; }
  .law-pin {
    width: 46px;
    cursor: default;
    transition: opacity 0.25s;
  }
  .law-pin img {
    display: block;
    width: 100%;
    border-radius: 5px;
    box-shadow: 3px 4px 0 rgba(20,10,6,0.4);
  }
  .law-pin.is-await img {
    opacity: 0;
    box-shadow: none;
  }
  .law-tip {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    width: 168px;
    padding: 8px 10px;
    font: 12px/1.4 "Palatino Linotype", "Book Antiqua", "Malgun Gothic", serif;
    color: #f0d9ae;
    text-align: left;
    background: rgba(20, 12, 10, 0.88);
    box-shadow: 3px 4px 0 rgba(20,10,6,0.35);
  }
  .law-pins[data-side="host"] .law-tip { left: 0; }
  .law-pins[data-side="guest"] .law-tip { right: 0; left: auto; }
  .law-pin:hover .law-tip { display: block; }
  .law-pin.is-off { display: none; }

  .series-marks {
    position: absolute;
    left: 50%;
    top: 2px;
    display: flex;
    align-items: center;
    gap: 1px;
    margin: 0;
    transform: translateX(-50%);
  }
  .gem {
    display: block;
    width: 26px;
    height: auto;
    opacity: 0.22;
    filter: grayscale(1);
    transform-origin: 50% 70%;
  }
  .gem.on {
    opacity: 1;
    filter: brightness(0.78);
  }
  .gem.on.is-stamp {
    animation: gemStamp 0.78s cubic-bezier(0.15, 0.85, 0.25, 1) both;
  }
  .gem-mid.is-stamp {
    animation: gemStampMove 0.78s cubic-bezier(0.15, 0.85, 0.25, 1) both;
  }
  @keyframes gemStamp {
    0% {
      transform: translateY(-34px) scale(1.7);
      filter: brightness(1.55) saturate(1.15);
      opacity: 0;
    }
    38% {
      transform: translateY(4px) scale(0.78, 1.22);
      filter: brightness(1.25);
      opacity: 1;
    }
    58% {
      transform: translateY(-7px) scale(1.18, 0.88);
      filter: brightness(1.05);
    }
    78% {
      transform: translateY(2px) scale(0.94, 1.06);
      filter: brightness(0.86);
    }
    100% {
      transform: none;
      filter: brightness(0.78);
      opacity: 1;
    }
  }
  @keyframes gemStampMove {
    0% { transform: translateY(-34px) scale(1.7); opacity: 0; }
    38% { transform: translateY(4px) scale(0.78, 1.22); opacity: 1; }
    58% { transform: translateY(-7px) scale(1.18, 0.88); }
    78% { transform: translateY(2px) scale(0.94, 1.06); }
    100% { transform: none; opacity: 1; }
  }
  .gem-mid {
    display: grid;
    width: 38px;
    opacity: 1;
    filter: none;
    transform-origin: 50% 70%;
  }
  .gem-mid img {
    grid-area: 1 / 1;
    width: 38px;
    height: auto;
    display: block;
    opacity: 0.22;
    filter: grayscale(1);
  }
  .gem-mid .gem-guest { opacity: 0; }
  .gem-mid.on-host .gem-host {
    opacity: 1;
    filter: brightness(0.78);
  }
  .gem-mid.on-guest .gem-host { opacity: 0; }
  .gem-mid.on-guest .gem-guest {
    opacity: 1;
    filter: brightness(0.78);
  }

  .card-slot { overflow: visible; }
  .card-text {
    position: absolute;
    left: 15%;
    right: 15%;
    top: 62%;
    bottom: auto;
    text-align: center;
    font-family: "Palatino Linotype", "Book Antiqua", "Malgun Gothic", serif;
    font-size: 11.5px;
    font-style: italic;
    line-height: 1.5;
    letter-spacing: 0.03em;
    color: #dcc8a0;
    text-shadow: 0 1px 0 rgba(12, 6, 2, 0.65);
    pointer-events: none;
  }

  #draftTable { cursor: default; }
  .draft-card {
    transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
  }
  .draft-card.tilt-l { transform: rotate(-11deg) translateY(2rem); }
  .draft-card.tilt-c { transform: none; }
  .draft-card.tilt-r { transform: rotate(11deg) translateY(2rem); }
  .draft-card.is-enter {
    pointer-events: none;
    transition: none;
  }
  .draft-card.is-enter.tilt-l {
    animation: cardRiseL 0.62s cubic-bezier(0.2, 0.88, 0.22, 1) both;
  }
  .draft-card.is-enter.tilt-c {
    animation: cardRiseC 0.62s cubic-bezier(0.2, 0.88, 0.22, 1) both;
  }
  .draft-card.is-enter.tilt-r {
    animation: cardRiseR 0.62s cubic-bezier(0.2, 0.88, 0.22, 1) both;
  }
  .draft-card.is-enter.is-fate {
    animation: cardRiseC 0.62s cubic-bezier(0.2, 0.88, 0.22, 1) both;
  }
  @keyframes cardRiseL {
    from { opacity: 0; transform: rotate(-11deg) translateY(calc(2rem + 48vh)); }
    to { opacity: 1; transform: rotate(-11deg) translateY(2rem); }
  }
  @keyframes cardRiseC {
    from { opacity: 0; transform: translateY(48vh); }
    to { opacity: 1; transform: none; }
  }
  @keyframes cardRiseR {
    from { opacity: 0; transform: rotate(11deg) translateY(calc(2rem + 48vh)); }
    to { opacity: 1; transform: rotate(11deg) translateY(2rem); }
  }
  .draft-card.is-hover:not(.is-burnt):not(.is-enter) {
    z-index: 6;
    filter: brightness(1.1);
  }
  .draft-card.tilt-l.is-hover:not(.is-burnt):not(.is-enter) {
    transform: rotate(-11deg) translateY(calc(2rem - 16px)) scale(1.07);
  }
  .draft-card.tilt-c.is-hover:not(.is-burnt):not(.is-enter) {
    transform: translateY(-16px) scale(1.07);
  }
  .draft-card.tilt-r.is-hover:not(.is-burnt):not(.is-enter) {
    transform: rotate(11deg) translateY(calc(2rem - 16px)) scale(1.07);
  }
  #draftTable:not(.is-wait) .draft-card.is-hover:not(.is-burnt) { cursor: pointer; }
  .draft-card.is-fate { pointer-events: none; cursor: default; }

  #draftHint {
    transition: color 0.2s ease, opacity 0.2s ease;
  }
  #draftTable.is-wait #draftHint {
    color: rgba(240, 217, 174, 0.55);
  }
  #draftTable.is-wait:not(.is-reveal):not(.is-rising) .draft-card:not(.is-burnt):not(.is-fate):not(.is-enter) {
    opacity: 0.72;
    filter: brightness(0.9);
  }
  #draftTable {
    transition: background-color 0.45s ease;
    overflow: visible;
  }
  #draftTable.is-fly {
    background-color: transparent !important;
  }
  #draftTable.is-fly #draftHint { opacity: 0; }

  .hud-gauge .gauge-svg {
    display: block;
    width: 100%;
    height: 14px;
    overflow: visible;
    filter: drop-shadow(2px 2px 0 rgba(20, 10, 6, 0.28));
  }
  .hud-gauge .gauge-bed { fill: rgba(20, 10, 6, 0.48); }
  .hud-gauge .gauge-ink {
    fill: none;
    stroke: rgba(40, 22, 16, 0.82);
    stroke-width: 1.55;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .hud-gauge .gauge-ink-soft {
    fill: none;
    stroke: rgba(40, 22, 16, 0.28);
    stroke-width: 1.05;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .hud-gauge-fill {
    transform-origin: left center;
    transform-box: fill-box;
    fill: url(#gaugeWash);
    transition: filter 0.2s ease, opacity 0.2s ease;
  }
  #startGauge {
    position: fixed;
    left: 50%;
    bottom: 36px;
    z-index: 45;
    width: min(280px, 70vw);
    transform: translateX(-50%);
    pointer-events: none;
  }
  #startGauge.hidden { display: none; }
  #startGauge.is-wait .hud-gauge-fill {
    opacity: 0.45;
    filter: grayscale(0.55);
  }

  #lawCard {
    opacity: 0;
    transform: translate(-50%, 58vh) scale(0.96);
    transition: opacity 0.38s ease, transform 0.68s cubic-bezier(0.2, 0.88, 0.22, 1);
  }
  #lawCard.is-up {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #wantedStatus {
    position: fixed; top: 14px; left: 50%;
    z-index: 20;
    display: none;
    min-width: 220px;
    max-width: min(420px, 90vw);
    padding: 12px 34px 10px 18px;
    text-align: center;
    pointer-events: auto;
    color: #3d2a1c;
    font: 14px/1.4 "Palatino Linotype", "Book Antiqua", "Malgun Gothic", serif;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,250,235,0.35), transparent 45%),
      linear-gradient(165deg, #ead6b4 0%, #dfc49a 55%, #d2b486 100%);
    box-shadow: 3px 4px 0 rgba(20,10,6,0.35);
    clip-path: polygon(1% 0, 99% 1%, 100% 10%, 98% 100%, 4% 99%, 0 88%);
    white-space: pre-line;
    opacity: 0;
    transform: translateX(-50%) translateY(-12px) scale(0.92);
  }
  #wantedStatus.show {
    display: block;
    animation: wanted-pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
  }
  #wantedStatus.update {
    animation: wanted-nudge 0.35s ease forwards;
  }
  #wantedStatus .code {
    display: block;
    margin-top: 4px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: #6e281c;
  }
  #wantedStatus .close {
    position: absolute;
    top: 6px; right: 10px;
    width: 22px; height: 22px;
    border: none;
    padding: 0;
    cursor: pointer;
    background: transparent;
    color: #6e281c;
    font: 700 16px/22px "Malgun Gothic", sans-serif;
    opacity: 0.7;
  }
  #wantedStatus .close:hover { opacity: 1; }

  @keyframes wanted-pop {
    0% { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(0.86) rotate(-1.5deg); }
    60% { opacity: 1; transform: translateX(-50%) translateY(2px) scale(1.04) rotate(0.6deg); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1) rotate(0deg); }
  }
  @keyframes wanted-nudge {
    0% { transform: translateX(-50%) scale(1); }
    40% { transform: translateX(-50%) scale(1.05); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }

  /* SweetAlert 등장 애니메이션 유지 */
  .swal-wanted.swal2-show {
    animation: swal2-show 0.3s !important;
  }
  .swal-wanted.swal2-hide {
    animation: swal2-hide 0.15s forwards !important;
  }

  #wantedBoard {
    position: fixed;
    inset: 0;
    z-index: 35;
    display: none;
    pointer-events: auto;
    cursor: default;
  }
  #wantedBoard.is-on { display: block; }
  #wantedBoard .wanted-dim {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  #wantedBoard .wanted-stage {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  #wantedBoard .wanted-sheet {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 8% 14%;
    background: transparent;
    border: 0;
    cursor: pointer;
    pointer-events: none;
    transform-origin: center center;
    overflow: visible;
  }
  #wantedBoard.is-ready .wanted-sheet { pointer-events: auto; z-index: 2; }
  #wantedBoard .wanted-blank {
    position: absolute;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    user-select: none;
    object-fit: fill;
    transition: opacity 0.18s ease;
  }
  #wantedBoard.is-ready:has(.wanted-sheet[data-sheet="multi"]:hover) .wanted-blank[data-blank="multi"],
  #wantedBoard.is-ready:has(.wanted-sheet[data-sheet="multi"].is-open) .wanted-blank[data-blank="multi"],
  #wantedBoard.is-ready.is-hosting .wanted-blank[data-blank="multi"],
  #wantedBoard.is-ready.is-joining .wanted-blank[data-blank="multi"],
  #wantedBoard.is-ready.is-seeking .wanted-blank[data-blank="multi"],
  #wantedBoard.is-ready:has(.wanted-sheet[data-sheet="ai"]:hover) .wanted-blank[data-blank="ai"],
  #wantedBoard.is-ready:has(.wanted-sheet[data-sheet="ai"].is-open) .wanted-blank[data-blank="ai"] {
    opacity: 1;
  }
  #wantedBoard .wanted-acts,
  #wantedBoard .wanted-wait,
  #wantedBoard .wanted-join,
  #wantedBoard .wanted-seek {
    position: relative;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #wantedBoard .wanted-notice {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  #wantedBoard.is-ready .wanted-sheet:hover .wanted-acts,
  #wantedBoard.is-ready .wanted-sheet.is-open .wanted-acts,
  #wantedBoard.is-ready .wanted-sheet:hover .wanted-wait,
  #wantedBoard.is-ready .wanted-sheet.is-open .wanted-wait,
  #wantedBoard.is-ready.is-hosting .wanted-sheet.is-multi .wanted-wait,
  #wantedBoard.is-ready.is-joining .wanted-sheet.is-multi .wanted-join,
  #wantedBoard.is-ready.is-seeking .wanted-sheet.is-multi .wanted-seek {
    opacity: 1;
    pointer-events: auto;
    transform: none;
  }
  #wantedBoard.is-ready .wanted-sheet:hover .wanted-notice.is-on,
  #wantedBoard.is-ready .wanted-sheet.is-open .wanted-notice.is-on {
    opacity: 1;
  }
  #wantedBoard.is-hosting .wanted-acts,
  #wantedBoard.is-joining .wanted-acts,
  #wantedBoard.is-seeking .wanted-acts { display: none; }
  #wantedBoard .wanted-wait,
  #wantedBoard .wanted-join,
  #wantedBoard .wanted-seek { display: none; }
  #wantedBoard.is-hosting .wanted-wait { display: flex; }
  #wantedBoard.is-joining .wanted-join { display: flex; }
  #wantedBoard.is-seeking .wanted-seek { display: flex; }
  #wantedBoard .wanted-acts {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 10px;
    width: 100%;
  }
  #wantedBoard .wanted-mode {
    position: absolute;
    z-index: 1;
    top: 13%;
    left: 11%;
    margin: 0;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    font: 700 10px/1 "Palatino Linotype", "Book Antiqua", "Malgun Gothic", serif;
    letter-spacing: 0.22em;
    color: #7a3324;
    text-shadow: 0 1px 0 rgba(255,244,220,0.55);
    transition: opacity 0.18s ease;
  }
  #wantedBoard.is-ready .wanted-sheet:hover .wanted-mode,
  #wantedBoard.is-ready .wanted-sheet.is-open .wanted-mode,
  #wantedBoard.is-ready.is-hosting .wanted-sheet.is-multi .wanted-mode,
  #wantedBoard.is-ready.is-joining .wanted-sheet.is-multi .wanted-mode,
  #wantedBoard.is-ready.is-seeking .wanted-sheet.is-multi .wanted-mode {
    opacity: 0.92;
  }
  #wantedBoard .wanted-acts button,
  #wantedBoard .wanted-wait button,
  #wantedBoard .wanted-join button,
  #wantedBoard .wanted-seek button {
    display: block;
    width: 100%;
    height: auto;
    flex: none;
    padding: 13px 12px 14px;
    border: 0;
    cursor: pointer;
    white-space: nowrap;
    font: 700 15px/1.2 "Palatino Linotype", "Book Antiqua", "Malgun Gothic", serif;
    letter-spacing: 0.06em;
    color: #5c1e14;
    text-shadow: 0 1px 0 rgba(255,248,230,0.85);
    background:
      radial-gradient(ellipse at 18% 12%, rgba(255,252,240,0.7), transparent 48%),
      linear-gradient(165deg, #f3e2c0 0%, #e6c894 52%, #d7b57a 100%);
    box-shadow:
      3px 4px 0 rgba(20,10,6,0.4),
      inset 0 0 0 1px rgba(90,55,35,0.28);
    clip-path: polygon(1.5% 0, 98% 2%, 100% 14%, 97% 100%, 4% 98%, 0 84%);
  }
  #wantedBoard .wanted-acts button.join {
    color: #3d2218;
    clip-path: polygon(0 6%, 97% 0, 100% 86%, 94% 100%, 2% 97%, 1% 12%);
  }
  #wantedBoard .wanted-acts button:hover,
  #wantedBoard .wanted-wait button:hover,
  #wantedBoard .wanted-join button:hover,
  #wantedBoard .wanted-seek button:hover { filter: brightness(1.08); }
  #wantedBoard .wanted-sheet.is-multi {
    justify-content: stretch;
    align-items: stretch;
    padding: 0;
    overflow: visible;
  }
  #wantedBoard .wanted-sheet.is-multi .wanted-acts {
    position: absolute;
    left: 12%;
    right: 12%;
    top: 30%;
    bottom: 14%;
    z-index: 2;
    width: auto;
    flex: none;
    justify-content: center;
    gap: 10px;
    padding: 0;
    transform: none;
  }
  #wantedBoard .wanted-sheet.is-multi .wanted-acts button {
    flex: none;
    width: 100%;
    min-height: 0;
    padding: 12.5px 8px 13.75px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #f3e2c4;
    text-shadow: 0 1px 0 rgba(20, 8, 4, 0.45);
    background:
      radial-gradient(ellipse at 18% 8%, rgba(255, 214, 170, 0.22), transparent 52%),
      linear-gradient(175deg, #9a3a28 0%, #6e2218 48%, #4e1610 100%);
    box-shadow:
      3px 4px 0 rgba(28, 10, 6, 0.5),
      inset 0 1px 0 rgba(255, 226, 190, 0.22),
      inset 0 -2px 0 rgba(20, 6, 4, 0.25);
    clip-path: polygon(2% 6%, 6% 0, 97% 3%, 100% 16%, 98% 94%, 92% 100%, 3% 97%, 0 82%);
  }
  #wantedBoard .wanted-sheet.is-multi .wanted-acts button.join {
    color: #f0e6d2;
    background:
      radial-gradient(ellipse at 80% 12%, rgba(255, 220, 180, 0.18), transparent 48%),

<div id="wantedStatus"></div>

      <div class="wanted-acts">
        <button type="button" data-act="ai" data-ai="0">풋내기</button>
